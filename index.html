<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>有一封給你的信件！</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            font-family: 'Helvetica Neue', Arial, sans-serif;

            perspective: 1000px;

        }



        /* 背景雲朵裝飾 */

        .cloud {

            position: absolute;

            background: white;

            border-radius: 100px;

            opacity: 0.4;

            animation: floatClouds 20s linear infinite;

        }

        .cloud::before, .cloud::after {

            content: '';

            position: absolute;

            background: white;

            border-radius: 50%;

        }

        .cloud.c1 { width: 150px; height: 50px; top: 15%; left: -160px; }

        .cloud.c1::before { width: 70px; height: 70px; top: -35px; left: 20px; }

        .cloud.c1::after { width: 50px; height: 50px; top: -25px; left: 80px; }

        

        .cloud.c2 { width: 200px; height: 60px; top: 50%; left: -210px; animation-delay: 5s; animation-duration: 25s; }

        .cloud.c2::before { width: 90px; height: 90px; top: -45px; left: 30px; }

        .cloud.c2::after { width: 60px; height: 60px; top: -30px; left: 100px; }



        @keyframes floatClouds {

            0% { transform: translateX(0); }

            100% { transform: translateX(calc(100vw + 210px)); }

        }



        /* 提示文字 */

        .hint {

            position: absolute;

            top: 20%;

            font-size: 20px;

            color: #557a95;

            font-weight: bold;

            animation: pulse 1.5s infinite alternate;

            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);

            z-index: 10;

        }

        @keyframes pulse {

            0% { opacity: 0.6; transform: scale(0.95); }

            100% { opacity: 1; transform: scale(1.05); }

        }



        /* 3D 場景容器 */

        .scene {

            width: 300px;

            height: 200px;

            position: relative;

            transform-style: preserve-3d;

            transition: transform 1s ease;

            cursor: pointer;

        }



        /* ================= 紙飛機 CSS ================= */

        .paper-plane {

            position: absolute;

            width: 100%;

            height: 100%;

            transform-style: preserve-3d;

            animation: flyAround 4s ease-in-out infinite alternate;

        }



        /* SVG 紙飛機造型 */

        .plane-svg {

            width: 150px;

            height: 150px;

            fill: #ffffff;

            filter: drop-shadow(5px 15px 10px rgba(0,0,0,0.15));

            transform: rotate(-15deg);

        }



        @keyframes flyAround {

            0% { transform: translateY(0) rotate(0deg); }

            50% { transform: translateY(-15px) rotate(3deg); }

            100% { transform: translateY(10px) rotate(-2deg); }

        }



        /* ================= 卡片 CSS ================= */

        .card {

            position: absolute;

            width: 320px;

            height: 450px;

            background: white;

            border-radius: 15px;

            box-shadow: 0 20px 40px rgba(0,0,0,0.15);

            padding: 30px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            opacity: 0;

            transform: scale(0) rotate(-10deg);

            pointer-events: none;

            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            border: 8px solid #fff;

            outline: 2px dashed #b5d5ff;

        }

        

        .card h1 {

            color: #ff6b6b;

            margin-bottom: 20px;

            font-size: 28px;

        }



        .card p {

            color: #4a4a4a;

            line-height: 1.8;

            font-size: 16px;

            white-space: pre-line;

        }



        .card .decor {

            font-size: 40px;

            margin-top: 20px;

            animation: bounce 1s infinite alternate;

        }

        @keyframes bounce {

            0% { transform: translateY(0); }

            100% { transform: translateY(-10px); }

        }



        /* ================= 狀態切換 ================= */

        /* 點擊後隱藏飛機與提示 */

        .clicked .paper-plane, .clicked .hint {

            opacity: 0;

            transform: scale(0) translateY(-100px);

            pointer-events: none;

            transition: all 0.5s ease;

        }



        /* 點擊後顯示卡片 */

        .clicked .card {

            opacity: 1;

            transform: scale(1) rotate(0deg);

            pointer-events: auto;

        }



        /* 慶祝紙花 */

        .confetti {

            position: absolute;

            width: 10px;

            height: 10px;

            background-color: #f00;

            position: absolute;

            animation: confettiFall 3s linear forwards;

            opacity: 0;

        }

        @keyframes confettiFall {

            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }

            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }

        }

    </style>

</head>

<body>



    <!-- 背景飄動的雲朵 -->

    <div class="cloud c1"></div>

    <div class="cloud c2"></div>



    <!-- 提示文字 -->

    <div class="hint" id="hintText">點擊紙飛機打開卡片 ✈️</div>



    <!-- 主互動場景 -->

    <div class="scene" id="mainScene" onclick="openCard()">

        

        <!-- 紙飛機物體 -->

        <div class="paper-plane">

            <!-- 使用內嵌 SVG 畫出俐落的紙飛機 -->

            <svg class="plane-svg" viewBox="0 0 24 24">

                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>

            </svg>

        </div>



        <!-- 卡片物體 -->

        <div class="card" id="letterCard">

            <h1>親愛的朋友：</h1>

            <p>好久不見！

               這是一封用網頁寫給你的卡片。

               祝你今天天天開心，

               心想事成！✨

            </p>

            <div class="decor">❤️</div>

        </div>



    </div>



    <script>

        function openCard() {

            const scene = document.getElementById('mainScene');

            

            // 如果已經打開過就不重複執行

            if (scene.classList.contains('clicked')) return;



            // 1. 切換 Class，觸發 CSS 隱藏飛機、放大卡片的動畫

            scene.classList.add('clicked');



            // 2. 釋放彩色慶祝紙花

            createConfetti();

        }



        function createConfetti() {

            const colors = ['#ff6b6b', '#ffd166', '#06d6a0', '#118ab2', '#7209b7', '#ff0a54'];

            for (let i = 0; i < 100; i++) {

                const confetti = document.createElement('div');

                confetti.classList.add('confetti');

                

                // 隨機樣式設定

                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                confetti.style.left = Math.random() * 100 + 'vw';

                confetti.style.top = '-5% ';

                confetti.style.width = Math.random() * 8 + 5 + 'px';

                confetti.style.height = Math.random() * 8 + 5 + 'px';

                confetti.style.animationDelay = Math.random() * 1.5 + 's';

                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';

                

                document.body.appendChild(confetti);

                

                // 動畫結束後移除元素，避免卡頓

                setTimeout(() => confetti.remove(), 4000);

            }

        }

    </script>

</body>

</html>
